# Local makepkg config override used to build this package.
#
# makepkg 7.1.0 already manages fakeroot automatically for the packaging step,
# so this file only sets a clean PACKAGER identity. It sources the system
# defaults first so all other settings (PKGEXT, BUILDENV, ...) stay intact.
#
# Use with:  makepkg --config ./makepkg.local.conf
source /etc/makepkg.conf
PACKAGER="sykoh <sykoh@localhost>"
