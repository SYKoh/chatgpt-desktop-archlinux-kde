# Local makepkg config override used to build this package.
# The system /etc/makepkg.conf has fakeroot removed from BUILDENV, which would
# make packaged files be owned by the build user instead of root. This override
# sources the system defaults and re-enables fakeroot so the resulting package
# gets normal root:root ownership.
#
# Use with:  makepkg --config ./makepkg.local.conf
source /etc/makepkg.conf
BUILDENV=(fakeroot !distcc color !ccache check !sign)
